<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TripAura | Login</title>

    <link rel="stylesheet" href="Style.css">

</head>


<body class="login-page">


    <div class="login-background"></div>


    <div class="login-container">


        <a href="home.html" class="back-home">
            ← Back to TripAura
        </a>


        <div class="login-box">


            <div class="login-logo">

                <img src="no bg tripaura.jpg"
                     alt="TripAura Logo">

            </div>


            <p class="login-tag">
                WELCOME BACK
            </p>


            <h1>
                Continue your
                <span>journey.</span>
            </h1>


            <p class="login-description">
                Sign in to discover more destinations
                and plan your next adventure.
            </p>


            <form>


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button type="submit"
                        class="login-submit">

                    Login →

                </button>


            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="signup-text">

                New to TripAura?

                <a href="#">
                    Create an account
                </a>

            </p>


        </div>

    </div>


</body>

</html>
